    "openai>=1.30.0",
    "openai-whisper>=20231117",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "protobuf>=5.29.6",
    "psutil>=5.9.0",
    "pyaudio>=0.2.14",
    "pyautogui>=0.9.54",
    "pydantic>=2.12.5",
    "pydantic-core>=2.41.5",
    "pyperclip>=1.9.0",
    "pytesseract>=0.3.10",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.0.0",
    "pyttsx3>=2.90",
    "qrcode[pil]>=7.4.2",
    "requests>=2.31.0",
    "segno>=1.6.1",
    "setuptools>=82.0.1",
    "speechrecognition>=3.10.0",
    "suno-bark",
    "torch",
    "torchaudio",
    "torchvision",
    "trafilatura>=2.0.0",
    "uvicorn>=0.44.0",
    "yt-dlp>=2026.3.3",
