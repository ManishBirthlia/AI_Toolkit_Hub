    "google-ai-generativelanguage>=0.6.15",
    "google-api-core>=2.25.2",
    "google-cloud-texttospeech>=2.16.0",
    "google-cloud-translate>=3.15.0",
    "google-cloud-vision>=3.4.0",
    "google-generativeai>=0.7.0",
    "googlemaps>=4.10.0",
    "groq>=0.9.0",
    "grpcio-status>=1.71.2",
    "httpx>=0.28.1",
    "h2>=4.1.0",
    "lxml>=6.0.2",
    "mpmath>=1.3.0",
